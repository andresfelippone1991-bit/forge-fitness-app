<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FORGE — Lee cada serie que registrás y ajusta tu plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#060504',
            obsidian2: '#0B0907',
            obsidian3: '#120E0A',
            ivory: '#F5F2E8',
            sand: '#9C8C70',
            sandDim: '#7A6C54',
            gold: {
              DEFAULT: '#D4A56A',
              soft: '#EBC992',
              hi: '#F7E2B5',
              deep: '#A87E48'
            },
            mint: '#7CFFB2'
          },
          fontFamily: {
            display: ['Cinzel', 'serif'],
            editorial: ['"Cormorant Garamond"', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg: #060504;
      --bg2: #0b0907;
      --ink: #f5f2e8;
      --gold: #d4a56a;
      --gold-soft: #ebc992;
      --gold-hi: #f7e2b5;
      --gold-deep: #a87e48;
      --rule: rgba(212, 165, 106, 0.18);
      --rule-strong: rgba(212, 165, 106, 0.38);
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      overscroll-behavior-y: none;
      background:
        radial-gradient(ellipse 80% 45% at 50% -10%, rgba(168, 126, 72, 0.16), transparent 65%),
        var(--bg);
    }

    .card-forge {
      background: linear-gradient(170deg, rgba(212, 165, 106, 0.065), rgba(255, 255, 255, 0.008) 65%);
      border: 1px solid var(--rule);
    }

    .card-forge-featured {
      background: linear-gradient(170deg, rgba(212, 165, 106, 0.11), rgba(14, 10, 6, 0.92) 70%);
      border: 1px solid var(--rule-strong);
      box-shadow: 0 20px 60px -24px rgba(212, 165, 106, 0.22);
    }

    .btn-gold {
      background: linear-gradient(180deg, #f6dcac 0%, #d9ad6c 52%, #a87e48 100%);
      color: #1a1208;
      box-shadow: inset 0 1px 0 rgba(255, 250, 235, 0.55), 0 10px 30px -10px rgba(212, 165, 106, 0.45);
    }

    .btn-gold:active {
      transform: scale(0.985);
    }

    .btn-ghost {
      background: rgba(212, 165, 106, 0.05);
      border: 1px solid var(--rule-strong);
      color: var(--gold-soft);
    }

    .text-gold-metallic {
      background: linear-gradient(180deg, #fbe9c0 0%, #e2b979 52%, #a9793f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hairline {
      border-color: var(--rule);
    }

    /* Slider de sensación RPE estilo TITUS */
    .rpe-track {
      background: linear-gradient(90deg, rgba(124, 255, 178, 0.45) 0%, rgba(212, 165, 106, 0.7) 50%, rgba(220, 76, 62, 0.65) 100%);
    }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    ::-webkit-scrollbar { display: none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view { animation: fadeUp 0.24s ease-out forwards; }
  </style>
</head>
<body class="font-sans antialiased selection:bg-gold/25 selection:text-gold-hi">

  <!-- HEADER MINIMALISTA -->
  <header id="app-header" class="fixed top-0 inset-x-0 z-40 bg-obsidian/88 backdrop-blur-xl border-b hairline pt-safe">
    <div class="max-w-lg mx-auto h-14 px-5 flex items-center justify-between">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="AppFORGE.irATab('plan')">
        <svg viewBox="0 0 32 32" class="w-7 h-7 shrink-0" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#D4A56A" stroke-opacity="0.5" stroke-width="1.2"/>
          <path d="M11 22V10h10v2.5h-7v2.6h5.8v2.4H14V22h-3z" fill="url(#forgeG)"/>
          <defs>
            <linearGradient id="forgeG" x1="16" y1="9" x2="16" y2="23" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F7E2B5"/><stop offset="1" stop-color="#A87E48"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="font-display text-base font-bold tracking-[0.22em] text-ivory">FORGE</span>
      </div>
      <div id="header-right-slot" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main id="app-main" class="max-w-lg mx-auto min-h-[100dvh] px-5 pt-20 pb-28">
    <!-- Renderizado dinámico por js/app.js -->
  </main>

  <!-- BARRA DE NAVEGACIÓN INFERIOR (4 TABS CLARAS AL ESTILO TITUS) -->
  <nav id="app-bottom-nav" class="fixed bottom-0 inset-x-0 z-40 bg-obsidian/95 backdrop-blur-xl border-t hairline pb-safe">
    <div class="max-w-lg mx-auto h-[68px] px-3 grid grid-cols-4 items-center">
      <button type="button" data-tab="entrenar" onclick="AppFORGE.irATab('entrenar')"
        class="flex flex-col items-center justify-center gap-1 py-1.5 transition-colors">
        <span class="material-symbols-outlined text-[22px]">calendar_today</span>
        <span class="text-[10px] font-medium tracking-wider">Entrenar</span>
      </button>

      <button type="button" data-tab="plan" onclick="AppFORGE.irATab('plan')"
        class="flex flex-col items-center justify-center gap-1 py-1.5 transition-colors">
        <span class="material-symbols-outlined text-[22px]">menu_book</span>
        <span class="text-[10px] font-medium tracking-wider">Plan</span>
      </button>

      <button type="button" data-tab="coach" onclick="AppFORGE.irATab('coach')"
        class="flex flex-col items-center justify-center gap-1 py-1.5 transition-colors">
        <span class="material-symbols-outlined text-[22px]">auto_awesome</span>
        <span class="text-[10px] font-medium tracking-wider">Coach</span>
      </button>

      <button type="button" data-tab="progreso" onclick="AppFORGE.irATab('progreso')"
        class="flex flex-col items-center justify-center gap-1 py-1.5 transition-colors">
        <span class="material-symbols-outlined text-[22px]">military_tech</span>
        <span class="text-[10px] font-medium tracking-wider">Progreso</span>
      </button>
    </div>
  </nav>

  <!-- PÍLDORA FLOTANTE DE DESCANSO -->
  <div id="floating-rest-pill"
    class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-md rounded-2xl bg-obsidian3/95 backdrop-blur-xl border border-gold/40 shadow-2xl px-4 py-3 transition-all duration-300 translate-y-24 opacity-0 pointer-events-none">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-gold text-[22px]">timer</span>
        <div>
          <div id="rest-label" class="font-mono text-[9px] uppercase tracking-[0.2em] text-sand">Descanso</div>
          <div id="rest-countdown-text" class="font-mono text-xl font-semibold text-ivory leading-tight">01:30</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="AppFORGE.sumarDescanso(30)"
          class="px-3 py-1.5 rounded-full btn-ghost font-mono text-[11px] font-medium">
          +30s
        </button>
        <button type="button" onclick="AppFORGE.saltarDescanso()"
          class="px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 text-sand hover:text-ivory text-[11px] font-medium">
          Listo
        </button>
      </div>
    </div>
    <div class="w-full h-[2px] bg-white/10 rounded-full overflow-hidden mt-2.5">
      <div id="rest-progress-bar" class="h-full bg-gold rounded-full transition-all duration-200" style="width: 100%"></div>
    </div>
  </div>

  <!-- MODAL / BOTTOM SHEET -->
  <div id="app-modal-backdrop" onclick="AppFORGE.cerrarModal(event)"
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="app-modal-panel"
      class="w-full max-w-lg bg-obsidian2 border-t sm:border border-gold/25 rounded-t-3xl sm:rounded-3xl p-6 max-h-[85dvh] overflow-y-auto shadow-2xl transform translate-y-8 transition-transform duration-200">
    </div>
  </div>

  <!-- TOAST ESTILO "● FORGE RECALIBRÓ" -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 w-[92%] max-w-md pointer-events-none"></div>

  <!-- SCRIPTS -->
  <script src="./js/database-embedded.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
